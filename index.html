<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bánh xe cảm xúc – Phiên bản Desktop & Mobile</title>
<style>
:root {
  --bg: #090e17;
  --surface: #0f1724;
  --card: #152032;
  --card-hover: #1c2b42;
  --border: #202e43;
  --border-light: rgba(255, 255, 255, 0.12);
  --text: #f1f5f9;
  --text-muted: #94a3b8;
  --text-sub: #64748b;
  --pill-bg: #1c283a;
  --pill-border: #2e415d;
  --blue-primary: #1d8cf8;
  --blue-glow: rgba(29, 140, 248, 0.5);
}

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--text);
  font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  min-height: 100vh;
}

/* Thanh điều hướng trên cùng (Header Bar) giống Ảnh 1 */
.top-header {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  padding: 16px 20px;
  max-width: 1300px;
  margin: 0 auto;
}

.btn-header {
  background: #1c2738;
  border: 1px solid var(--border);
  color: #cbd5e1;
  padding: 9px 20px;
  border-radius: 999px;
  font-size: 13.5px;
  font-weight: 600;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  transition: all .2s;
  flex-shrink: 0;
}
.btn-header:hover {
  background: #25354c;
  color: #ffffff;
}

.search-box {
  position: relative;
  width: 100%;
  max-width: 480px;
}
.search-input {
  width: 100%;
  padding: 10px 18px 10px 40px;
  border-radius: 999px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text);
  font-size: 14px;
  outline: none;
  transition: border-color .2s, box-shadow .2s;
}
.search-input:focus {
  border-color: var(--blue-primary);
  box-shadow: 0 0 0 3px var(--blue-glow);
}
.search-icon {
  position: absolute;
  left: 14px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--text-muted);
  pointer-events: none;
}

/* Bố cục ứng dụng (Desktop: 2 Cột giống Ảnh 1 | Mobile: 1 Cột) */
.app-container {
  max-width: 1300px;
  margin: 0 auto;
  padding: 10px 24px 40px 24px;
  display: flex;
  flex-direction: column;
  gap: 24px;
}

@media (min-width: 960px) {
  .app-container {
    display: grid;
    grid-template-columns: 1.15fr 1fr;
    align-items: start;
    gap: 36px;
    padding-top: 15px;
  }
}

/* Khung bánh xe bên trái */
.wheel-wrapper {
  width: 100%;
  aspect-ratio: 1 / 1;
  max-width: 580px;
  margin: 0 auto;
  position: relative;
  overflow: hidden;
  border-radius: 28px;
  background: radial-gradient(circle at center, #152033 0%, #090e17 72%);
  border: 1px solid #1a2536;
  box-shadow: 0 16px 40px rgba(0, 0, 0, 0.45);
}

#w {
  width: 100%;
  height: 100%;
  display: block;
  user-select: none;
}

#wheel-stage {
  transform-origin: 250px 250px;
  transition: transform 0.65s cubic-bezier(0.2, 0.9, 0.3, 1);
}

#center-hub {
  cursor: pointer;
  transform-origin: 250px 250px;
  transition: transform 0.65s cubic-bezier(0.2, 0.9, 0.3, 1);
}

.hub-pulse {
  animation: pulse 2.2s infinite ease-in-out;
}

@keyframes pulse {
  0% { filter: drop-shadow(0 0 6px rgba(29, 140, 248, 0.5)); }
  50% { filter: drop-shadow(0 0 18px rgba(29, 140, 248, 0.9)); }
  100% { filter: drop-shadow(0 0 6px rgba(29, 140, 248, 0.5)); }
}

.slice {
  cursor: pointer;
  transition: opacity .35s ease;
}
.slice path {
  stroke: var(--bg);
  stroke-width: 1.25;
}
.slice text {
  fill: #ffffff;
  stroke: rgba(0, 0, 0, 0.55);
  stroke-width: 1.6px;
  paint-order: stroke;
  text-anchor: middle;
  dominant-baseline: central;
  pointer-events: none;
  font-weight: 500;
  user-select: none;
}

/* Bảng điều khiển bên phải (Panel) */
.side-panel {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 24px;
  padding: 24px;
  box-shadow: 0 12px 35px rgba(0,0,0,0.35);
  min-height: 520px;
  display: flex;
  flex-direction: column;
}

.panel-nav {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 22px;
  gap: 10px;
}

.btn-back {
  border-radius: 999px;
  font-size: 13.5px;
  font-weight: 600;
  cursor: pointer;
  transition: all .2s;
  display: inline-flex;
  align-items: center;
  border: 1px solid var(--pill-border);
  background: var(--pill-bg);
  color: #cbd5e1;
  padding: 7px 18px;
}
.btn-back:hover:not(:disabled) {
  background: #27374f;
  color: #ffffff;
}
.btn-back:disabled {
  opacity: 0.4;
  cursor: not-allowed;
}

.step-breadcrumbs {
  display: flex;
  gap: 6px;
}
.step-item {
  border-radius: 999px;
  font-size: 12.5px;
  padding: 6px 14px;
  border: 1px solid var(--pill-border);
  background: var(--pill-bg);
  color: var(--text-muted);
  font-weight: 500;
  user-select: none;
}
.step-item.active {
  background: #ffffff;
  color: #0b1018;
  border-color: #ffffff;
  font-weight: 700;
}

.panel-main-title {
  text-align: center;
  font-size: 1.38rem;
  font-weight: 700;
  color: #ffffff;
  margin: 4px 0 6px 0;
}

.panel-subtitle {
  text-align: center;
  font-size: 0.95rem;
  color: var(--text-muted);
  line-height: 1.5;
  margin: 0 auto 20px auto;
}

.section-prompt {
  text-align: center;
  font-size: 1.15rem;
  font-weight: 700;
  color: #ffffff;
  margin: 10px 0 16px 0;
}

/* Danh sách thẻ cảm xúc (Option Cards) */
.option-list {
  display: flex;
  flex-direction: column;
  gap: 12px;
  flex-grow: 1;
}

.option-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 15px 18px;
  cursor: pointer;
  transition: background .2s, border-color .2s, transform .15s;
}
.option-card:hover {
  background: var(--card-hover);
  border-color: #3b5070;
  transform: translateY(-1px);
}
.option-card:active {
  transform: scale(0.99);
}

.option-head {
  display: flex;
  align-items: center;
  gap: 12px;
}
.option-dot {
  width: 12px;
  height: 12px;
  border-radius: 50%;
  flex-shrink: 0;
}
.option-name {
  font-size: 1.05rem;
  font-weight: 700;
  color: #ffffff;
}
.option-desc {
  margin: 6px 0 0 24px;
  font-size: 0.9rem;
  color: var(--text-muted);
  line-height: 1.45;
}

/* Nút xóa lựa chọn (Clear selection) */
.btn-reset-link {
  display: block;
  margin: 18px auto 0 auto;
  background: none;
  border: none;
  color: var(--text-muted);
  font-size: 0.92rem;
  text-decoration: underline;
  cursor: pointer;
  padding: 6px 12px;
}
.btn-reset-link:hover {
  color: #ffffff;
}

/* Khối chi tiết cấp độ 3 */
.detail-block {
  margin-bottom: 20px;
}
.detail-heading {
  font-size: 0.8rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: #7d90a6;
  margin: 0 0 6px 0;
}
.detail-body {
  font-size: 0.98rem;
  line-height: 1.6;
  color: #e2e8f0;
  margin: 0;
}

.sibling-chips {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 10px;
}
.sibling-btn {
  border: 1px solid transparent;
  border-radius: 999px;
  padding: 8px 16px;
  color: #fff;
  font-size: 13.5px;
  cursor: pointer;
  font-weight: 500;
  transition: all .2s;
}
.sibling-btn.active {
  background: #ffffff !important;
  color: #0b1018 !important;
  font-weight: 700;
}

/* Chân trang thông tin */
.footer-info {
  margin-top: 22px;
  padding: 14px 18px;
  background: rgba(15, 23, 36, 0.7);
  border: 1px solid var(--border);
  border-radius: 16px;
  font-size: 0.86rem;
  color: var(--text-sub);
  line-height: 1.5;
}
</style>
</head>
<body>

<header class="top-header">
  <button class="btn-header" onclick="resetToInitial()">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="10"/><path d="M12 2a10 10 0 0 1 10 10"/></svg>
    Colors
  </button>
  <div class="search-box">
    <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input id="q" class="search-input" type="search" placeholder="Search feelings... (ví dụ: lo lắng, biết ơn, giận)" autocomplete="off">
  </div>
</header>

<main class="app-container">
  <!-- Cột bên trái: Bánh xe cảm xúc -->
  <div class="wheel-column">
    <div class="wheel-container">
      <svg id="w" viewBox="0 0 500 500" role="img" aria-label="Bánh xe cảm xúc">
        <defs>
          <!-- Bộ lọc viền sáng viền trắng giống Ảnh 1 -->
          <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
            <feDropShadow dx="0" dy="0" stdDeviation="4.5" flood-color="#ffffff" flood-opacity="0.9"/>
          </filter>
          <filter id="hub-shadow" x="-30%" y="-30%" width="160%" height="160%">
            <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.6"/>
          </filter>
        </defs>
        <g id="wheel-stage">
          <g id="wheel-slices"></g>
          <!-- Viền phát sáng cho múi được chọn -->
          <path id="active-outline" d="" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" filter="url(#glow)" pointer-events="none" style="display:none;"></path>
          
          <!-- Tâm bánh xe (Center Hub) -->
          <g id="center-hub">
            <circle id="hub-circle" cx="250" cy="250" r="48" fill="#1d8cf8" stroke="rgba(255,255,255,0.7)" stroke-width="2.5" filter="url(#hub-shadow)"/>
            <text id="hub-title" x="250" y="242" fill="#ffffff" font-size="16" font-weight="800" text-anchor="middle" dominant-baseline="central">Start</text>
            <text id="hub-sub" x="250" y="261" fill="rgba(255,255,255,0.85)" font-size="10.5" font-weight="500" text-anchor="middle" dominant-baseline="central">tap to begin</text>
          </g>
        </g>
      </svg>
    </div>
  </div>

  <!-- Cột bên phải: Bảng thông tin chi tiết -->
  <div class="panel-column">
    <div id="panel" class="side-panel"></div>
    <div class="footer-info">
      💡 <b>Mẹo:</b> Bắt đầu từ 6 cảm xúc gốc, sau đó đi sâu dần vào các tầng cụ thể hơn để thấu hiểu rõ cảm xúc và trạng thái cơ thể của bạn.
    </div>
  </div>
</main>

// Dữ liệu 72 cảm xúc hoàn chỉnh
const D = [
['Buồn','#2e86c1','Phản ứng trước mất mát, tổn thương và xa cách. Nó làm bạn chậm lại và nhắc nhở cơ thể cần được an ủi, nâng đỡ.',[
['Tổn thương',['Ngượng ngùng|Thấy mình bị phơi bày, bối rối và chỉ muốn biến mất ngay lập tức.|Nóng bừng mặt, né tránh ánh mắt, cười gượng gạo.|Thở ra chậm, tâm sự với người tin cậy, tự đối xử tử tế với mình.','Thất vọng|Điều kỳ vọng mong chờ không xảy ra, lòng chùng xuống.|Nặng ở bụng, hay thở dài, hai vai rũ xuống.|Gọi tên điều bạn kỳ vọng, cho phép mình buồn một chút rồi mới tìm cách gỡ.','Xấu hổ|Cảm thấy bản thân nhỏ bé, tự trách vì để lộ điều không hay.|Cúi đầu, nóng rát lồng ngực, thu mình im lặng.|Chia sẻ với một người bao dung; tự viết lời nhắc mình vẫn đang học hỏi.']],
['Chán nản',['Trống rỗng|Phẳng lặng, vô cảm, mọi thứ từng quan trọng nay bỗng xa xôi.|Mệt mỏi dù ngủ đủ, khẩu vị thay đổi thất thường.|Giữ nếp sinh hoạt cơ bản, đi dạo dưới ánh nắng, trò chuyện với một người bạn.','Tự ti|Thấy mình luôn kém cỏi hơn người khác, càng so sánh càng buồn.|Dáng gù, giọng nhỏ, né tránh sự chú ý.|Hạn chế mạng xã hội; chỉ so sánh với phiên bản của chính mình ngày hôm qua.','Bất lực|Cảm giác như mọi cố gắng, nỗ lực đều vô ích.|Cơ thể nặng nề, hơi thở nông, phản xạ chậm chạp.|Phân loại việc kiểm soát được; làm một việc nhỏ nhất trước mắt, nhờ trợ giúp.']],
['Tội lỗi',['Hối hận|Ước gì mình có thể làm lại, nhận thức rõ tác động đau lòng lên người khác.|Nhói ở ngực, thắt bụng, khó đi vào giấc ngủ.|Chân thành xin lỗi không kèm từ "nhưng"; hỏi họ cần gì để bù đắp.','Hổ thẹn|Không chỉ là "mình làm sai" mà cảm giác "mình thật tồi tệ".|Muốn trốn tránh, nóng mặt, tự trách dồn dập.|Tách biệt hành động lỗi lầm khỏi giá trị con người; sửa chữa điều có thể.','Gánh vác|Tự nhận mọi rắc rối là do mình, dù bản chất không hoàn toàn vậy.|Căng cứng cơ cổ vai, nghiến chặt hàm.|Ghi ra giấy phần thuộc trách nhiệm của mình và phần của người khác để trả lại.']],
['Cô đơn',['Bị bỏ rơi|Người ta cần nhất đã rời đi, để lại khoảng trống khó lấp đầy.|Hụt hẫng trong lồng ngực, dễ rơi nước mắt.|Cho phép mình tiếc thương; chủ động kết nối lại với một người an toàn ngay hôm nay.','Bị tổn hại|Thấy mình bị đối xử bất công mà xung quanh không ai thấu hiểu.|Cảnh giác cao độ, dễ giật mình, kiệt sức.|Tâm sự với người tin cậy, bảo vệ sự an toàn cho bản thân trước tiên.','Mong manh|Cảm giác chỉ cần thêm một biến cố nhỏ là có thể vỡ òa.|Dễ rưng rưng, nhạy cảm với tiếng động lớn, run rẩy.|Giảm tải công việc, nghỉ ngơi trong không gian ấm áp, ngủ đủ giấc.']]]],

['Giận','#3d5afe','Phản ứng khi mục tiêu bị cản trở, ranh giới bị xâm phạm hoặc thấy sự bất công. Giận là nguồn năng lượng thúc đẩy bảo vệ bản thân.',[
['Căm ghét',['Hay chê bai|Chỉ chăm chăm nhìn vào lỗi sai của đối phương với giọng điệu cay nghiệt.|Nghiến hàm, mím chặt môi, giọng nói gắt gỏng.|Chuyển lời chỉ trích thành lời đề nghị; dừng lại 5 giây trước khi phát ngôn.','Coi thường|Lạnh lùng, xem đối phương không xứng đáng để bận tâm.|Đảo mắt, quay mặt đi, nụ cười mỉa mai.|Hỏi một câu thật lòng; tự hỏi mình đang dùng sự khinh miệt để che giấu nỗi đau nào.','Hoài nghi|Mất niềm tin, luôn đề phòng người khác lừa dối.|Nhướng mày, khoanh tay, giữ khoảng cách phòng thủ.|Dựa vào sự thật và bằng chứng cụ thể thay vì suy diễn tiêu cực.']],
['Hung hăng',['Bị khiêu khích|Bị kích động trúng điểm nhạy cảm, muốn lập tức đáp trả tay đôi.|Nóng bừng mặt, tim đập thình thịch, siết chặt nắm tay.|Hít sâu và thở ra thật dài; rời khỏi khu vực đó 10 phút trước khi phản hồi.','Thù địch|Coi người khác là kẻ thù, sẵn sàng xung đột.|Cơ bắp căng cứng, mặt đỏ, đi lại bồn chồn.|Tạm dừng nhắn tin hay tranh luận; giải tỏa năng lượng bằng vận động mạnh.','Bực bội|Cố gắng mãi mà không thành, kiên nhẫn cạn kiệt dần.|Hay thở dài, đau nhức đầu, nghiến răng.|Tạm nghỉ giải lao; chia nhỏ chướng ngại vật thành bước nhỏ hơn.']],
['Đối đầu',['Căm hận|Muốn người kia phải trả giá, suy nghĩ trả đũa lấp đầy tâm trí.|Nóng rát lồng ngực, khó ngủ, luôn căng thẳng.|Gọi tên tổn thương thực sự; giữ khoảng cách an toàn, tránh hành vi bột phát.','Tự cho là đúng|Khăng khăng mình luôn đúng còn người khác sai, muốn dạy dỗ họ.|Cằm hếch cao, lưng thẳng đơ, giọng điệu giảng giải.|Tự hỏi: "Có góc nhìn nào mình chưa thấy không?", lắng nghe trước khi nói.','Cáu gắt|Chỉ một cử chỉ nhỏ cũng làm nổi đóa, sức chịu đựng mỏng manh.|Cau mày, thở ngắn, trả lời cộc lốc.|Kiểm tra lại xem bạn có đang đói, thiếu ngủ hay làm việc quá sức không.']],
['Thu mình',['Kháng cự|Ngấm ngầm chống đối, càng bị ép càng muốn lùi lại.|Khoanh tay trước ngực, trì hoãn công việc.|Nói rõ lời từ chối lịch sự bằng lời thay vì im lặng kéo dài thời gian.','Chê thầm|Lặng lẽ phán xét, âm thầm ghi sổ lỗi của người khác.|Mím môi, tránh nhìn thẳng, hay thở dài ngấm ngầm.|Chọn vấn đề cốt lõi nhất để chia sẻ thẳng thắn: "Mình cần..." thay vì "Bạn luôn...".','Gạt đi|Nói "kệ" hoặc "không sao" để né tránh vì thấy giải thích vô ích.|Nhún vai, giọng đều đều vô cảm, mắt nhìn điện thoại.|Tự trả lời câu hỏi: "Điều thật sự làm mình thấy phiền lòng là gì?".']]]],

['Sợ','#8e24aa','Phản ứng trước mối đe dọa hoặc điều mơ hồ chưa chắc chắn đối với cơ thể, vị thế hoặc giá trị bản thân.',[
['Bị từ chối',['Bị phản bội|Bàng hoàng vì người mình trao trọn niềm tin lại làm tổn thương mình.|Cảm giác như bị đấm vào bụng, buồn nôn, run rẩy.|Chưa vội ra quyết định hệ trọng; ở cạnh người thực sự an toàn.','Bị gạt bỏ|Lời nói của mình không được ai lắng nghe hay coi trọng.|Nghẹn họng, chùng bụng, nóng bừng tai.|Bình tĩnh nhắc lại: "Mình muốn chia sẻ hết ý"; chọn người biết lắng nghe.','Bị xa lánh|Cảm giác như người ngoài cuộc, không thuộc về nơi này.|Nặng trịch ở ngực, dè chừng, mệt mỏi vì phải gượng gạo.|Tìm kiếm cộng đồng chung sở thích; kết nối lại với người bạn thân cũ.']],
['Yếu đuối',['Vô giá trị|Trống rỗng, thấy mình thừa thãi và không có chút sức nặng nào.|Cơ thể rã rời, lưng gù, thở nông.|Kể ra một việc có ích mình làm được hôm nay; đi dạo nhẹ nhàng.','Nhỏ bé|Bị lu mờ hoàn toàn trước đám đông, không ai để ý tới.|Căng hàm, bồn chồn, thu mình góc phòng.|Viết ra 3 giá trị độc nhất của bản thân; tham gia nhóm nhỏ ấm cúng.','Chưa đủ tốt|Luôn lo sợ mình chưa đủ giỏi, sắp sửa thất bại.|Suy nghĩ quay cuồng, mất ngủ, bấu chặt ngón tay.|Hỏi bản thân: "Mức này đã đủ tốt cho hôm nay chưa?", giảm bớt cầu toàn.']],
['Bị đe dọa',['Phơi bày|Điểm yếu bí mật bị nhìn thấy một cách không mong muốn.|Tim đập dồn dập, mặt tái hoặc đỏ, muốn biến mất.|Tìm đến không gian an toàn; thiết lập ranh giới rõ ràng về quyền riêng tư.','Hồi hộp|Có sự kiện quan trọng sắp tới mà chưa chắc mình gánh vác nổi.|Bồn chồn, đổ mồ hôi tay, giọng run.|Hít thở 4 nhịp (hít 4s, giữ 4s, thở 6s); vận động nhẹ để xả bớt adrenaline.','Lo lắng|Đầu óc liên tục tua các kịch bản tồi tệ "nếu như...".|Căng cơ vai, quặn bụng, trằn trọc ban đêm.|Viết nỗi lo ra giấy; khoanh tròn những điều bạn thực tế xử lý được ngay.']],
['Không chắc',['Phớt lờ|Làm ra vẻ bất cần để trốn tránh cảm giác hoang mang bên trong.|Cười trừ, đổi chủ đề, hít thở nông.|Tự thành thật: "Nếu mình thực sự quan tâm, điều mình sợ nhất là gì?".','Rối bời|Quá nhiều mớ bòng bong ập tới, không biết bắt đầu từ đâu.|Khó tập trung, đơ người, cảm giác choáng ngợp.|Ghi mọi thứ ra giấy; chọn duy nhất 1 việc cần ưu tiên trong 20 phút.','Mơ hồ|Lơ lửng giữa ngã ba đường, không biết tương lai sẽ ra sao.|Nôn nao ở bụng, liên tục muốn người khác trấn an.|Liệt kê những điều chắc chắn hiện tại; chọn một bước đi nhỏ có thể điều chỉnh.']]]],

['Vui','#d81b60','Niềm hân hoan, sự sống động và cảm giác mãn nguyện khi một mình hoặc bên cạnh người thân thương.',[
['Hào hứng',['Giác quan rộn ràng|Các giác quan bừng sáng, cảm nhận sâu sắc vẻ đẹp xung quanh.|Làn da ấm áp, thở êm dịu, râm ran dễ chịu.|Chậm lại để tận hưởng một bữa ăn ngon hoặc một bản nhạc yêu thích.','Tràn năng lượng|Phấn chấn, sẵn sàng bắt tay vào hành động ngay.|Bước chân thoăn thoắt, ánh mắt rạng rỡ, tim đập nhanh hứng khởi.|Bắt tay vào dự án bạn ấp ủ; vận động thể thao; giữ nếp ngủ đủ.','Háo hức|Có điều tốt đẹp sắp diễn ra, nóng lòng chờ đợi.|Rộn ràng trong bụng, hay cười mỉm, khó ngồi yên.|Chia sẻ niềm vui với người thân; chuẩn bị chu đáo để đón nhận.']],
['Sáng tạo',['Cảm hứng|Ý tưởng tuôn trào dào dạt, thấy mọi thứ đều có thể kết nối.|Lồng ngực rộn ràng, mắt sáng, quên cả thời gian.|Ghi chép lại ngay ý tưởng; dành một khoảng thời gian riêng tư để sáng tác.','Mơ mộng|Hình dung về tương lai rực rỡ và tin tưởng mình làm được.|Ngực nhẹ nhõm, hơi thở thoải mái, ánh nhìn xa xăm.|Vẽ hoặc viết ra tầm nhìn chi tiết; bắt đầu làm bản nháp đầu tiên.','Tinh nghịch|Thảnh thơi, muốn đùa vui, chọc cười và thử nghiệm cái mới.|Cơ thể nhún nhảy, hay cười to, giọng nói ríu rít.|Tham gia một trò chơi; chơi cùng trẻ nhỏ hoặc thú cưng yêu quý.']],
['Nhạy cảm',['Tỉnh thức|Chú ý sâu sắc đến từng chi tiết và nét đẹp bình dị quanh mình.|Tâm trí sáng tỏ, thở chậm, cảm giác rùng mình xúc động.|Dừng lại 3 phút, hít thở sâu và cảm nhận 5 điều bạn đang nghe, thấy, chạm.','Hân hoan|Niềm vui thuần khiết từ tận đáy lòng, không cần bất kỳ lý do nào.|Nụ cười tự nhiên trên môi, lồng ngực ấm áp, tinh thần nhẹ bẫng.|Giữ trọn khoảnh khắc này thêm vài nhịp thở; lan tỏa nụ cười tới người khác.','Biết ơn|Xúc động sâu sắc trước những điều tốt lành mình được trao tặng.|Ấm áp nơi ngực, ánh mắt dịu dàng, đôi khi rưng rưng.|Nhắn một lời cảm ơn chân thành; viết nhật ký biết ơn mỗi tối.']],
['Gần gũi',['Được chấp nhận|Được là chính mình hoàn toàn mà không sợ bị phán xét.|Cơ thể thả lỏng, hít thở tự nhiên như được trở về nhà.|Dành nhiều thời gian hơn cho những người trân trọng con người thật của bạn.','Được trân trọng|Nhận thức rõ giá trị và ý nghĩa của mình trong mắt người khác.|Lưng thẳng hơn, ánh mắt kiên định và ấm áp.|Đón nhận lời khen ngợi một cách trọn vẹn; chia sẻ sự biết ơn với họ.','Bình yên bên nhau|Khoảnh khắc bên nhau tĩnh lặng, không cần nói nhiều vẫn hiểu.|Cơ bắp thư giãn, nhịp thở đồng điệu, sự tĩnh lặng dễ chịu.|Gác lại điện thoại; tận hưởng trọn vẹn sự hiện diện cùng người thương.']]]],

['Mạnh mẽ','#b23b23','Cảm giác vững vàng, tự tin vào năng lực bản thân và làm chủ được cuộc sống.',[
['Vững tin',['Vững vàng|Vững lòng tin vào con đường của mình và sự hỗ trợ xung quanh.|Dáng đứng thẳng, giọng nói trầm ấm và quả quyết.|Nhắc lại những thử thách bạn từng vượt qua; đưa ra quyết định can đảm.','Được ghi nhận|Sự trung thành và cống hiến của bạn được đền đáp xứng đáng.|Lồng ngực ấm, vai thả lỏng, nụ cười an tâm.|Mở lòng đón nhận sự công nhận; tiếp tục phát huy thế mạnh của mình.','Tin sẽ ổn|Niềm tin sắt đá rằng mọi bão giông rồi sẽ qua đi tốt đẹp.|Cảm giác thanh thản, ánh mắt hướng lên, hơi thở đều đặn.|Tập trung làm thật tốt phần việc của ngày hôm nay; duy trì sự lạc quan.']],
['Hy vọng',['Mong đợi|Háo hức ngóng trông về thành quả phía trước.|Đầu óc tỉnh táo, phản ứng nhanh nhạy, tràn đầy hy vọng.|Lập kế hoạch hành động thực tế; giữ tâm thế cởi mở và linh hoạt.','Được truyền cảm hứng|Bừng sáng ý chí muốn thay đổi và tạo ra giá trị mới.|Căng tràn nhiệt huyết, cảm giác có dòng năng lượng dâng trào.|Chọn ngay một hành động cụ thể trong hôm nay để biến cảm hứng thành thực tế.','Có ý nghĩa|Thấy rõ sứ mệnh và vai trò quan trọng của mình trong tập thể.|Dáng đi dứt khoát, ánh nhìn kiên định có mục tiêu.|Tập trung vào phần việc tạo ra giá trị lớn nhất; giúp đỡ người đi sau.']],
['Tự hào',['Tin cậy|Tin tưởng trọn vẹn vào năng lực phán đoán của chính mình.|Ngực mở rộng, bước đi thong dong, dứt khoát.|Giữ đúng lời hứa với bản thân; tự thưởng cho sự nỗ lực kiên trì.','Thành công|Chinh phục được mục tiêu lớn lao sau chuỗi ngày nỗ lực.|Nụ cười rạng rỡ, thở phào mãn nguyện, tinh thần phấn chấn.|Ăn mừng chiến thắng; tri ân những người đồng hành; nghỉ ngơi trước mục tiêu mới.','Tự tin|Hiểu rõ điểm mạnh của mình, không cần phô trương chứng tỏ.|Đầu ngẩng cao, giọng nói rành mạch, phong thái đĩnh đạc.|Đón nhận thử thách mới; duy trì thái độ khiêm nhường học hỏi.']],
['Được tôn trọng',['Được coi trọng|Ý kiến và sự hiện diện của bạn có sức nặng với mọi người.|Vai buông lỏng tự nhiên, nụ cười tự tin, ấm áp.|Tiếp tục đóng góp ý kiến mang tính xây dựng; chọn môi trường lành mạnh.','Được cảm ơn|Những cống hiến thầm lặng được nhìn thấy và trân trọng.|Ánh mắt xúc động, bước chân nhẹ nhàng, lòng vui tươi.|Nói lời cảm ơn chân thành đáp lại; tiếp tục lan tỏa sự tận tâm.','Có tiếng nói|Được lắng nghe và là chỗ dựa đáng tin cậy cho người khác.|Tư thế đĩnh đạc, phát ngôn điềm đạm, ánh nhìn vững vàng.|Dùng tiếng nói để nâng đỡ người yếu thế; khiêm tốn thừa nhận thiếu sót.']]]],

['Bình yên','#c67d0a','Trạng thái tĩnh lặng, an toàn, ổn định và kết nối sâu sắc từ bên trong.',[
['Trầm tư',['Suy ngẫm|Lắng lòng nhìn lại hành trình đã qua để đúc kết bài học.|Thở sâu và chậm, ánh mắt nhìn xa, cơ thể thư thái.|Viết nhật ký chiêm nghiệm; đi dạo một mình không đeo tai nghe.','Muốn xin lỗi|Nhận ra sai sót và thật tâm muốn hàn gắn mối quan hệ.|Giọng nói nhỏ nhẹ, ngực chùng xuống, cơ mặt dịu lại.|Gặp mặt xin lỗi chân thành: thừa nhận việc làm, lắng nghe và sửa đổi.','Trân trọng quá khứ|Nhìn lại chặng đường cũ với lòng biết ơn vì đã cho mình trưởng thành.|Cảm giác ấm áp lan tỏa khắp người, mỉm cười thanh thản.|Gửi tin nhắn tri ân tới người từng giúp đỡ bạn trong lúc khó khăn.']],
['Thân mật',['Trân quý|Biết ơn và hạnh phúc vì có người này kề cận trong đời.|Muốn trao một cái ôm ấm áp, ánh nhìn yêu thương dịu dàng.|Nói với họ bằng lời cụ thể: "Mình rất may mắn khi có bạn ở bên".','Tin tưởng|Cảm giác an toàn tuyệt đối, có thể dỡ bỏ mọi rào cản phòng thủ.|Cơ bắp mềm mại, hơi thở sâu, hoàn toàn thư giãn.|Mở lòng chia sẻ tâm tư thầm kín; gìn giữ lòng tin đôi bên.','Yêu thương|Tràn ngập tình yêu ấm áp, mong ước mọi điều tốt lành cho đối phương.|Lồng ngực mở rộng rộn ràng, giọng nói dịu dàng.|Chăm sóc họ bằng hành động nhỏ; đừng quên dành sự dịu dàng đó cho chính mình.']],
['An tâm',['Dịu dàng|Đủ an toàn để sống thật với sự mỏng manh và xúc cảm sâu lắng.|Trái tim mềm mại, khóe mắt dễ rưng rưng vì điều đẹp đẽ.|Ở cạnh người biết nâng niu cảm xúc; nghỉ ngơi tĩnh dưỡng.','Yên lòng|Thấy nhẹ nhõm về tương lai, không còn nhu cầu kiểm soát mọi thứ.|Hai vai hạ lỏng, hít thở sâu, tâm trí bình an.|Buông bỏ một điều vượt tầm kiểm soát; tận hưởng bữa tối bình yên.','Gắn kết|Kết nối tinh thần sâu sắc, không cần vội vã hay chứng minh.|Cơ thể ấm áp, nhịp thở khoan thai, im lặng nhưng ấm cúng.|Dành thời gian chất lượng bên người thân, cùng uống trà trò chuyện.']],
['Chăm sóc',['Chu đáo|Luôn nghĩ cho cảm xúc của người khác và sẵn sàng sẻ chia.|Tư thế hiện diện bình thản, hai tay cởi mở, giọng nhẹ nhàng.|Hỏi han người bên cạnh: "Hôm nay bạn thế nào?"; nhớ chăm lo cho chính mình.','Tử tế|Muốn xoa dịu nỗi đau của ai đó mà không màng đền đáp.|Cảm giác ấm ngực, nụ cười hiền hậu, cơ thể thư thái.|Làm một điều tử tế thầm lặng; dành lời khen chân thành cho ai đó.','Thân thiện|Cởi mở, hòa nhã và luôn chào đón mọi người xung quanh.|Nụ cười thường trực, ánh mắt thân tình, nét mặt tươi tắn.|Chủ động chào hỏi hàng xóm; kết nối bạn mới; gọi điện hỏi thăm bạn cũ.']]]]
];

const CALL_TO_BE = [
  'Lời nhắc dừng lại, cho phép bản thân được nghỉ ngơi, an ủi nỗi đau và tìm kiếm sự đồng cảm ấm áp.',

  'Lời nhắc ở lại trọn vẹn với niềm vui này, ghi nhớ cảm giác hạnh phúc và lan tỏa sự ấm áp đến xung quanh.',

  'Lời nhắc duy trì sự tĩnh lặng quý giá trong tâm hồn, giữ gìn những mối liên kết chân thành và nuôi dưỡng tâm an.'

const $ = s => document.querySelector(s);
const rd = Math.PI / 180;
const P = (r, a) => (250 + r * Math.cos(a)).toFixed(1) + ' ' + (250 + r * Math.sin(a)).toFixed(1);
const arc = (r0, r1, a0, a1) => `M${P(r1,a0)}A${r1} ${r1} 0 0 1 ${P(r1,a1)}L${P(r0,a1)}A${r0} ${r0} 0 0 0 ${P(r0,a0)}Z`;

function buildSlice(r0, r1, d0, d1, t, fs, col, op, at, am) {
  const rm = (r0 + r1) / 2;
  const ra = am * rd;
  const x = 250 + rm * Math.cos(ra);
  const y = 250 + rm * Math.sin(ra);
  const displayName = t.split(' (')[0]; // Hiển thị tên ngắn gọn trên múi
  return `<g class="slice" ${at} data-am="${am.toFixed(2)}"><path d="${arc(r0,r1,d0*rd,d1*rd)}" fill="${col}" fill-opacity="${op}"/><text x="${x.toFixed(1)}" y="${y.toFixed(1)}" font-size="${fs}" transform="rotate(${am.toFixed(1)} ${x.toFixed(1)} ${y.toFixed(1)})">${displayName}</text></g>`;
}

// Xây dựng hình học cho 72 múi bánh xe
let slicesHtml = '';
D.forEach((C, c) => {
  const cMid = -60 + c * 60;
  slicesHtml += buildSlice(48, 100, -90 + c*60, -30 + c*60, C[0], 12, C[1], 1, `data-c="${c}"`, cMid);
  C[3].forEach((M, m) => {
    const i = c * 4 + m;
    const mMid = -90 + (i + 0.5) * 15;
    slicesHtml += buildSlice(100, 168, -90 + i*15, -75 + i*15, M[0], 9.5, C[1], 0.88, `data-c="${c}" data-m="${m}"`, mMid);
    M[1].forEach((O, o) => {
      const k = i * 3 + o;
      const oMid = -90 + (k + 0.5) * 5;
      const oName = O.split('|')[0];
      slicesHtml += buildSlice(168, 250, -90 + k*5, -85 + k*5, oName, 7.8, C[1], 0.72, `data-c="${c}" data-m="${m}" data-o="${o}"`, oMid);
    });
  });
});
$('#wheel-slices').innerHTML = slicesHtml;

// Quản lý trạng thái ứng dụng
let isStarted = false; // Trạng thái đã ấn nút Bắt đầu (Start) hay chưa
let sel = { c: null, m: null, o: null };
let currentRotation = 0;

// Xoay hướng chữ sao cho luôn dễ đọc xuôi mắt
function updateTextOrientations(stageRot) {
  document.querySelectorAll('.slice').forEach(g => {
    const am = parseFloat(g.dataset.am);
    const text = g.querySelector('text');
    if (!text) return;
    let eff = (am + stageRot) % 360;
    if (eff < 0) eff += 360;
    const flip = (eff > 90 && eff < 270);
    const textRot = flip ? am + 180 : am;
    const x = text.getAttribute('x');
    const y = text.getAttribute('y');
    text.setAttribute('transform', `rotate(${textRot.toFixed(1)} ${x} ${y})`);
  });
}

function selectEmotion(c, m = null, o = null) {
  isStarted = true;
  sel = {
    c: c === null ? null : +c,
    m: m === null ? null : +m,
    o: o === null ? null : +o
  };
  render();
}

function goBack() {
  if (sel.o !== null) {
    sel.o = null;
  } else if (sel.m !== null) {
    sel.m = null;
  } else if (sel.c !== null) {
    sel.c = null;
  } else {
    isStarted = false;
  }
  render();
}

function resetToInitial() {
  isStarted = false;
  sel = { c: null, m: null, o: null };
  render();
}

// Hàm render toàn bộ giao diện theo từng trạng thái
function render() {
  const stage = $('#wheel-stage');
  const hub = $('#center-hub');
  const hubCircle = $('#hub-circle');
  const hubTitle = $('#hub-title');
  const hubSub = $('#hub-sub');
  const outline = $('#active-outline');
  const panel = $('#panel');

  // TRẠNG THÁI 1: Chưa bấm bắt đầu -> NÚT XANH DƯƠNG "START / TAP TO BEGIN" (GIỐNG ẢNH 2)
  if (!isStarted) {
    currentRotation = 0;
    stage.style.transform = 'translate(0px, 0px) scale(1) rotate(0deg)';
    hub.style.transform = 'rotate(0deg)';
    hubCircle.setAttribute('fill', '#1d8cf8');
    hubCircle.setAttribute('stroke', '#ffffff');
    hubCircle.setAttribute('stroke-width', '2.5');
    hubCircle.classList.add('hub-pulse');
    hubTitle.textContent = 'Start';
    hubTitle.setAttribute('font-size', '16');
    hubTitle.setAttribute('y', '242');
    hubSub.textContent = 'tap to begin';
    hubSub.style.display = 'block';
    outline.style.display = 'none';

    document.querySelectorAll('.slice').forEach(g => {
      g.style.opacity = '1';
    });
    updateTextOrientations(0);

    panel.innerHTML = `
      <div class="panel-nav">
        <button class="btn-back" disabled>← Back</button>
        <div class="step-breadcrumbs">
          <span class="step-item active">1 Core</span>
          <span class="step-item">2 Closer</span>
          <span class="step-item">3 Exact</span>
        </div>
      </div>
      <h2 class="panel-main-title">Bánh xe cảm xúc (The Feeling Wheel)</h2>
      <p class="panel-subtitle">Công cụ hỗ trợ gọi tên cảm xúc dựa trên nghiên cứu tâm lý của Tiến sĩ Gloria Willcox.</p>
      
      <div style="text-align: center; margin: 40px auto; padding: 25px; background: rgba(29, 140, 248, 0.08); border: 1px dashed rgba(29, 140, 248, 0.4); border-radius: 20px;">
        <div style="width: 60px; height: 60px; background: #1d8cf8; border-radius: 50%; margin: 0 auto 16px auto; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 20px rgba(29,140,248,0.6);">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5"><polygon points="5 3 19 12 5 21 5 3"/></svg>
        </div>
        <h3 style="font-size: 1.25rem; margin: 0 0 8px 0; color: #fff;">Sẵn sàng khám phá cảm xúc?</h3>
        <p style="color: var(--text-muted); margin: 0 0 20px 0; font-size: 0.95rem;">Nhấp vào nút tròn <b>Start</b> ở tâm bánh xe hoặc chọn trực tiếp một múi cảm xúc để bắt đầu.</p>
        <button class="btn-header" style="background: #1d8cf8; color: #fff; border: none; padding: 10px 24px; margin: 0 auto;" onclick="isStarted=true; render();">
          Bắt đầu ngay
        </button>
      </div>
    `;
    return;
  }

  hubCircle.classList.remove('hub-pulse');

  // TRẠNG THÁI 2: ĐÃ BẤM START NHƯNG CHƯA CHỌN CẢM XÚC GỐC -> TÂM LÀ NÚT "CLOSE", BÊN PHẢI HIỂN THỊ 6 NHÓM CẢM XÚC (GIỐNG ẢNH 3)
  if (sel.c === null) {
    currentRotation = 0;
    stage.style.transform = 'translate(0px, 0px) scale(1) rotate(0deg)';
    hub.style.transform = 'rotate(0deg)';
    hubCircle.setAttribute('fill', '#1d8cf8');
    hubCircle.setAttribute('stroke', '#ffffff');
    hubTitle.textContent = 'Close';
    hubTitle.setAttribute('font-size', '16');
    hubTitle.setAttribute('y', '250');
    hubSub.style.display = 'none'; // Ẩn sub ở nút Close giống Ảnh 3
    outline.style.display = 'none';

    document.querySelectorAll('.slice').forEach(g => {
      g.style.opacity = '1';
    });
    updateTextOrientations(0);

    panel.innerHTML = `
      <div class="panel-nav">
        <button class="btn-back" onclick="resetToInitial()">← Back</button>
        <div class="step-breadcrumbs">
          <span class="step-item active">1 Core</span>
          <span class="step-item">2 Closer</span>
          <span class="step-item">3 Exact</span>
        </div>
      </div>
      <h3 class="section-prompt" style="margin-top: 5px;">Cảm xúc nào gần nhất với trạng thái của bạn lúc này?</h3>
      <p class="panel-subtitle" style="margin-bottom: 16px;"></p>
      <div class="option-list">
        ${D.map((C, c) => `
          <div class="option-card" onclick="selectEmotion(${c})">
            <div class="option-head">
              <span class="option-dot" style="background: ${C[1]}"></span>
              <span class="option-name">${C[0]}</span>
            </div>
            <p class="option-desc">${C[2]}</p>
          </div>
        `).join('')}
      </div>
    `;
    return;
  }

  // TRẠNG THÁI 3: ĐÃ CHỌN CẢM XÚC -> THU PHÓNG BÁNH XE SANG TRÁI, HIỆN VIỀN PHÁT SÁNG (GIỐNG ẢNH 1)
  const C = D[sel.c];

  // Tính góc xoay mục tiêu để múi được chọn nằm ngang về phía bên phải (0 độ)
  let targetAngle = 0;
  if (sel.o !== null) {
    const i = sel.c * 4 + sel.m;
    const k = i * 3 + sel.o;
    targetAngle = -90 + (k + 0.5) * 5;
  } else if (sel.m !== null) {
    const i = sel.c * 4 + sel.m;
    targetAngle = -90 + (i + 0.5) * 15;
  } else {
    targetAngle = -60 + sel.c * 60;
  }

  const rawRot = -targetAngle;
  let delta = (rawRot - currentRotation) % 360;
  if (delta > 180) delta -= 360;
  if (delta < -180) delta += 360;
  currentRotation += delta;

  // Zoom và dịch chuyển tâm bánh xe sang lề trái
  const tx = -125;
  const scale = 1.48;

  stage.style.transform = `translate(${tx}px, 0px) scale(${scale}) rotate(${currentRotation}deg)`;
  hub.style.transform = `rotate(${-currentRotation}deg)`;
  hubCircle.setAttribute('fill', C[1]);
  hubCircle.setAttribute('stroke', 'rgba(255, 255, 255, 0.6)');

  updateTextOrientations(currentRotation);

  // Hiển thị viền trắng phát sáng cho múi đang chọn
  let targetSelector = '';
  if (sel.o !== null) {
    targetSelector = `.slice[data-c="${sel.c}"][data-m="${sel.m}"][data-o="${sel.o}"]`;
  } else if (sel.m !== null) {
    targetSelector = `.slice[data-c="${sel.c}"][data-m="${sel.m}"]:not([data-o])`;
  } else {
    targetSelector = `.slice[data-c="${sel.c}"]:not([data-m])`;
  }

  const targetEl = document.querySelector(targetSelector);
  if (targetEl) {
    const p = targetEl.querySelector('path');
    outline.setAttribute('d', p.getAttribute('d'));
    outline.style.display = 'block';
  } else {
    outline.style.display = 'none';
  }

  // Làm mờ các múi không liên quan để làm nổi bật nhánh được chọn
  document.querySelectorAll('.slice').forEach(g => {
    const gc = g.dataset.c;
    const gm = g.dataset.m;
    const go = g.dataset.o;

    if (gc != sel.c) {
      g.style.opacity = '0.12';
    } else if (sel.o !== null) {
      if (go != null) {
        g.style.opacity = (gm == sel.m && go == sel.o) ? '1' : (gm == sel.m ? '0.45' : '0.12');
      } else if (gm != null) {
        g.style.opacity = (gm == sel.m) ? '0.85' : '0.22';
      } else {
        g.style.opacity = '0.65';
      }
    } else if (sel.m !== null) {
      if (go != null) {
        g.style.opacity = (gm == sel.m) ? '1' : '0.18';
      } else if (gm != null) {
        g.style.opacity = (gm == sel.m) ? '1' : '0.35';
      } else {
        g.style.opacity = '0.85';
      }
    } else {
      if (go != null) g.style.opacity = '0.6';
      else if (gm != null) g.style.opacity = '0.85';
      else g.style.opacity = '1';
    }
  });

  // Tên hiển thị ở tâm bánh xe
  let activeName = '';
  if (sel.o !== null) {
    activeName = C[3][sel.m][1][sel.o].split('|')[0].split(' (')[0];
  } else if (sel.m !== null) {
    activeName = C[3][sel.m][0].split(' (')[0];
  } else {
    activeName = C[0].split(' (')[0];
  }
  hubTitle.textContent = activeName;
  hubTitle.setAttribute('font-size', activeName.length > 8 ? '13' : '15');
  hubTitle.setAttribute('y', '241');
  hubSub.textContent = '← back';
  hubSub.style.display = 'block';

  // Hiển thị nội dung Panel bên phải theo cấp độ
  if (sel.m === null) {
    // CẤP ĐỘ 1: Chọn nhóm cảm xúc bậc 2 (Closer)
    panel.innerHTML = `
      <div class="panel-nav">
        <button class="btn-back" onclick="goBack()">← Back</button>
        <div class="step-breadcrumbs">
          <span class="step-item" onclick="selectEmotion(${sel.c})">1 Core</span>
          <span class="step-item active">2 Closer</span>
          <span class="step-item">3 Exact</span>
        </div>
      </div>
      <h2 class="panel-main-title">${C[0]}</h2>
      <p class="panel-subtitle">${C[2]}</p>
      <h3 class="section-prompt">Thuộc nhóm cụ thể nào?</h3>
      <div class="option-list">
        ${C[3].map((M, m) => `
          <div class="option-card" onclick="selectEmotion(${sel.c}, ${m})">
            <div class="option-head">
              <span class="option-dot" style="background: ${C[1]}"></span>
              <span class="option-name">${M[0]}</span>
            </div>
            <p class="option-desc">${M_DESC[M[0]] || 'Khám phá các biểu hiện chi tiết hơn.'}</p>
          </div>
        `).join('')}
      </div>
      <button class="btn-reset-link" onclick="selectEmotion(null)">Xóa lựa chọn</button>
    `;
  } else if (sel.o === null) {
    // CẤP ĐỘ 2: Chọn cảm xúc cụ thể bậc 3 (Exact) - GIỐNG HỆT ẢNH 1
    const M = C[3][sel.m];
    panel.innerHTML = `
      <div class="panel-nav">
        <button class="btn-back" onclick="goBack()">← Back</button>
        <div class="step-breadcrumbs">
          <span class="step-item" onclick="selectEmotion(${sel.c})">1 Core</span>
          <span class="step-item" onclick="selectEmotion(${sel.c}, ${sel.m})">2 Closer</span>
          <span class="step-item active">3 Exact</span>
        </div>
      </div>
      <h2 class="panel-main-title">${C[0]} › ${M[0]}</h2>
      <p class="panel-subtitle">${M_DESC[M[0]] || 'A settled closeness with someone you love.'}</p>
      <h3 class="section-prompt">Which fits best? (Cảm xúc nào khớp nhất?)</h3>
      <div class="option-list">
        ${M[1].map((O_str, o) => {
          const parts = O_str.split('|');
          return `
            <div class="option-card" onclick="selectEmotion(${sel.c}, ${sel.m}, ${o})">
              <div class="option-head">
                <span class="option-dot" style="background: ${C[1]}"></span>
                <span class="option-name">${parts[0]}</span>
              </div>
              <p class="option-desc">${parts[1]}</p>
            </div>
          `;
        }).join('')}
      </div>
      <button class="btn-reset-link" onclick="selectEmotion(null)">Clear selection (Xóa lựa chọn)</button>
    `;
  } else {
    // CẤP ĐỘ 3: Chi tiết cảm xúc chính xác kèm gợi ý chăm sóc bản thân
    const M = C[3][sel.m];
    const O = M[1][sel.o].split('|');
    const callText = CALL_TO_BE[sel.c] || 'Lời nhắc chậm lại và thấu cảm với chính mình.';
    panel.innerHTML = `
      <div class="panel-nav">
        <button class="btn-back" onclick="goBack()">← Back</button>
        <div class="step-breadcrumbs">
          <span class="step-item" onclick="selectEmotion(${sel.c})">1 Core</span>
          <span class="step-item" onclick="selectEmotion(${sel.c}, ${sel.m})">2 Closer</span>
          <span class="step-item active">3 Exact</span>
        </div>
      </div>
      <h2 class="panel-main-title">${C[0]} › ${M[0]} › ${O[0]}</h2>
      <button class="btn-reset-link" style="margin-bottom: 22px;" onclick="selectEmotion(null)">Clear selection (Chọn lại từ đầu)</button>
      
      <div class="detail-block">
        <div class="detail-heading">BẠN CÓ THỂ ĐANG CẢM THẤY</div>
        <p class="detail-body">${O[1]}</p>
      </div>

      <div class="detail-block">
        <div class="detail-heading">DẤU HIỆU CƠ THỂ</div>
        <p class="detail-body">${O[2]}</p>
      </div>

      <div class="detail-block">
        <div class="detail-heading">ĐIỀU CẢM XÚC NÀY ĐANG NHẮC NHỞ</div>
        <p class="detail-body">${callText}</p>
      </div>

      <div class="detail-block">
        <div class="detail-heading">GỢI Ý CHĂM SÓC BẢN THÂN</div>
        <p class="detail-body">${O[3]}</p>
      </div>

      <div class="detail-block">
        <div class="detail-heading">CÁC CẢM XÚC CÙNG NHÓM (${M[0]})</div>
        <div class="sibling-chips">
          ${M[1].map((x, j) => {
            const name = x.split('|')[0];
            const isCur = j === sel.o;
            return `<button class="sibling-btn ${isCur ? 'active' : ''}" style="background:${isCur ? '#ffffff' : C[1]}" onclick="selectEmotion(${sel.c}, ${sel.m}, ${j})">${name}</button>`;
          }).join('')}
        </div>
      </div>
    `;
  }
}

// Bấm vào tâm bánh xe
$('#center-hub').onclick = e => {
  e.stopPropagation();
  if (!isStarted) {
    isStarted = true;
    render();
  } else if (sel.c === null) {
    resetToInitial();
  } else {
    goBack();
  }
};

// Bấm vào các múi trên bánh xe
$('#wheel-slices').onclick = e => {
  const g = e.target.closest('.slice');
  if (!g) return;
  const { c, m, o } = g.dataset;
  selectEmotion(c, m ?? null, o ?? null);
};

// Ô tìm kiếm cảm xúc
const nm = s => s.normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/đ/g, 'd').toLowerCase();
$('#q').oninput = e => {
  const q = nm(e.target.value.trim());
  if (!q) { render(); return; }
  isStarted = true;
  let results = [];
  D.forEach((C, c) => {
    if (nm(C[0]).includes(q)) results.push({ c, m: null, o: null, title: C[0], type: 'Core', col: C[1] });
    C[3].forEach((M, m) => {
      if (nm(M[0]).includes(q)) results.push({ c, m, o: null, title: `${C[0]} › ${M[0]}`, type: 'Closer', col: C[1] });
      M[1].forEach((O_str, o) => {
        const parts = O_str.split('|');
        if (nm(parts[0]).includes(q) || nm(parts[1]).includes(q)) {
          results.push({ c, m, o, title: `${parts[0]} (${M[0]})`, sub: parts[1], type: 'Exact', col: C[1] });
        }
      });
    });
  });

  const panel = $('#panel');
  if (!results.length) {
    panel.innerHTML = `<h2 class="panel-main-title">Không tìm thấy kết quả</h2><p class="panel-subtitle">Không có cảm xúc nào khớp với "${e.target.value}". Bạn hãy thử từ khóa gần nghĩa nhé.</p>`;
    return;
  }
  panel.innerHTML = `
    <h2 class="panel-main-title">Kết quả tìm kiếm (${results.length})</h2>
    <div class="option-list" style="margin-top: 15px;">
      ${results.slice(0, 8).map(r => `
        <div class="option-card" onclick="$('#q').value=''; selectEmotion(${r.c}, ${r.m}, ${r.o})">
          <div class="option-head">
            <span class="option-dot" style="background: ${r.col}"></span>
            <span class="option-name">${r.title}</span>
          </div>
          ${r.sub ? `<p class="option-desc">${r.sub}</p>` : ''}
        </div>
      `).join('')}
    </div>
  `;
};

// Khởi chạy giao diện ban đầu
render();
</script>
</body>
</html>
